<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shelf</title>
  <meta name="description" content="kyosuke0306 が作ってきたものの一覧">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shelf">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Shelf</h1>
    <p class="sub"><span id="count"></span></p>
    <div class="bar">
      <nav id="filters" class="filters" aria-label="カテゴリで絞り込み"></nav>
      <div id="sort" class="sort" role="group" aria-label="並び順">
        <button type="button" data-order="new">新しい順</button>
        <button type="button" data-order="old">古い順</button>
      </div>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <button type="button" id="to-top" class="to-top" aria-label="画面の上へ戻る">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <dialog id="detail" class="detail" aria-labelledby="d-title">
    <div class="d-inner">
      <button class="close" id="close" aria-label="閉じる">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="d-media" id="d-media"></div>
      <div class="d-body">
        <p class="d-meta" id="d-meta"></p>
        <h2 id="d-title"></h2>
        <p class="d-summary" id="d-summary"></p>
        <dl class="d-facts" id="d-facts"></dl>
        <ul class="d-points" id="d-points"></ul>
        <ul class="d-tech" id="d-tech"></ul>
        <div class="d-links" id="d-links"></div>
      </div>
    </div>
  </dialog>

  <script src="works.js"></script>
  <script src="app.js"></script>
</body>
</html>
